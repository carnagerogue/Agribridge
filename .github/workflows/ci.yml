name: Build and test

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      AGRIBRIDGE_DEMO: "false"
      OPENAI_API_KEY: ""
      AT_API_KEY: ""
      WHATSAPP_ACCESS_TOKEN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Compile production server
        run: npm run build:server
      - name: Build web application
        run: npm run build
      - name: Test application and API
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high

  postgres:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same major version as the Compose deployment stack.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Test migrations against PostgreSQL
        run: npx tsx --test server/tests/migrations.test.ts
